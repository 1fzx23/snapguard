[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapguard"
version = "1.0.0"
description = "Directory snapshot, change detection & integrity guard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "1fzx23", email = "1fzx23@example.com" }]
keywords = ["snapshot", "integrity", "diff", "watch", "backup", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]

dependencies = []

[project.optional-dependencies]
watch = ["watchdog>=3.0"]

[project.scripts]
snapguard = "snapguard:main"

[project.urls]
Homepage = "https://1fzx23.github.io/snapguard/"
Repository = "https://github.com/1fzx23/snapguard"
Issues = "https://github.com/1fzx23/snapguard/issues"

[tool.hatch.build.targets.wheel]
py-modules = ["snapguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/snapguard.py",
    "/README.md",
    "/LICENSE",
]
